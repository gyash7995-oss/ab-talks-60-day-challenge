<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Metadata -->
    <title>AB Talks 60-Day Coding Challenge — Build Consistency & Get Hired</title>
    <meta name="description" content="Build a daily habit of coding, share proof of work publicly on GitHub & LinkedIn, and get noticed by elite recruiters. Select your track and start today." />
    <link rel="canonical" href="https://abtalks-challenge.vercel.app/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts for Premium Visuals -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook Social Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AB Talks 60-Day Coding Challenge — Consistency to Career" />
    <meta property="og:description" content="Maintain a 60-day streak of public commits and posts. Elevate your portfolio and get hired." />
    <meta property="og:url" content="https://abtalks-challenge.vercel.app/" />
    <meta property="og:image" content="https://abtalks-challenge.vercel.app/favicon.svg" />
    <meta property="og:site_name" content="AB Talks Coding Challenge" />

    <!-- Twitter / X Social Previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AB Talks 60-Day Coding Challenge" />
    <meta name="twitter:description" content="Commit code, share on LinkedIn daily, maintain your streak, and unlock career opportunities." />
    <meta name="twitter:image" content="https://abtalks-challenge.vercel.app/favicon.svg" />

    <!-- Structured Data (JSON-LD) for Web Application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AB Talks 60-Day Coding Challenge",
        "url": "https://abtalks-challenge.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires HTML5, Javascript, CSS3",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "author": {
          "@type": "Organization",
          "name": "AB Talks",
          "url": "https://www.abtalks.in/"
        },
        "description": "A structured 60-day interactive coding challenge track with daily tasks, automatic proof submission check, and streak tracking for students."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
